// Thin autolinked module: the engine and bridge ship precompiled in libs/bgtrackkit.aar. The only
// source here is the package stub autolinking needs to discover the module; the TurboModule spec
// is generated by the React Native Gradle plugin from ../package.json's codegenConfig.

apply plugin: "com.android.library"

// AGP 9 compiles Kotlin itself unless android.builtInKotlin=false; applying kotlin-android on top fails.
def needsKotlinPlugin() {
    def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0].toInteger()
    if (agpMajor <= 8) return true
    def builtIn = providers.gradleProperty("android.builtInKotlin").orNull
    return builtIn != null && !builtIn.toBoolean()
}

if (needsKotlinPlugin()) {
    apply plugin: "org.jetbrains.kotlin.android"
}
apply plugin: "com.facebook.react"

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
    namespace "com.bglocationdemo.tracking.rn"
    compileSdk safeExtGet("compileSdkVersion", 36)

    defaultConfig {
        minSdk safeExtGet("minSdkVersion", 24)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    api(files("libs/bgtrackkit.aar"))

    // A local AAR carries no POM, so the engine's runtime dependencies are declared here.
    implementation("com.google.android.gms:play-services-location:21.3.0")
    implementation("androidx.room:room-runtime:2.7.2")
    implementation("androidx.room:room-ktx:2.7.2")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")
    implementation("androidx.core:core-ktx:1.16.0")
}
